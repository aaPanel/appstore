services:
  BT_SERVICE_NAME6:
    image: helloz/zmark:${VERSION}
    #    container_name: ${CONTAINER_NAME}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    restart: always
    dns:
      - '119.29.29.29'
      - '223.5.5.5'
    ports:
      - ${HOST_IP}:${WEB_HTTP_PORT}:3080
    volumes:
      - ${APP_PATH}/data:/opt/zmark/data
    labels:
      createdBy: "bt_apps"
    networks:
      - baota_net

networks:
  baota_net:
    external: true