services:
  # RustFS 主服务
  rustfs:
    image: rustfs/rustfs:${VERSION}
    # 镜像默认以 rustfs(10001) 用户运行，而 ${APP_PATH} 下的挂载目录由面板以 root 创建，
    # 非 root 用户无法写入数据卷会导致启动失败，故显式以 root 运行
    user: "0:0"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    ports:
      - "${HOST_IP}:${WEB_API_PORT}:9000" # S3 API 端口
      - "${HOST_IP}:${WEB_HTTP_PORT}:9001" # 控制台端口
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_USER}
      - RUSTFS_SECRET_KEY=${RUSTFS_PASSWORD}
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/logs
      # 镜像默认仅写日志文件，开启后 docker logs 中也能看到日志
      - RUSTFS_OBS_LOG_STDOUT_ENABLED=true
    volumes:
      # 日志目录不能放在数据目录内，否则会被当做一个 bucket 出现在控制台里
      - ${APP_PATH}/data:/data
      - ${APP_PATH}/logs_data:/logs
    restart: always
    healthcheck:
      # 9000 为 S3 服务健康检查，9001 为控制台健康检查
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "5M"
        max-file: "10"
    labels:
      createdBy: "bt_apps"
    networks:
      - baota_net
networks:
  baota_net:
    external: true
