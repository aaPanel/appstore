services:
  talebook:
    image: talebook/talebook:latest
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    ports:
      - ${HOST_IP}:${WEB_HTTP_PORT}:80
    restart: always
    volumes:
      - ${APP_PATH}/data:/data
    labels:
      createdBy: "bt_apps"
