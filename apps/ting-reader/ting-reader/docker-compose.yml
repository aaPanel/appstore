services:
  BT_SERVICE_NAME6:
    image: dqsq2e2/ting-reader:${VERSION}
    #    container_name: ${CONTAINER_NAME}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    restart: always
    ports:
      - ${HOST_IP}:${WEB_HTTP_PORT}:3000
    volumes:
      - ${APP_PATH}/data:/app/data
      - ${APP_PATH}/storage:/app/storage
      - ${APP_PATH}/plugins:/app/plugins
      - ${APP_PATH}/temp:/app/temp
    environment:
      - TING_SECURITY__JWT_SECRET=${JWT_SECRET}
      - TING_SERVER__PORT=3000
    labels:
      createdBy: "bt_apps"
    networks:
      - baota_net

networks:
  baota_net:
    external: true
