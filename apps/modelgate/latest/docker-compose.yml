services:
  BT_SERVICE_NAME6:
    image: docker.cnb.cool/bring/tools/modelgate:${VERSION}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    restart: unless-stopped
    ports:
      - ${HOST_IP}:${MODELGATE_HTTP_PORT}:3000
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - MODELGATE_DATA_DIR=/app/data
      - MODELGATE_EDITION=${MODELGATE_EDITION}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES_SECONDS=${JWT_ACCESS_EXPIRES_SECONDS}
      - JWT_REFRESH_EXPIRES_SECONDS=${JWT_REFRESH_EXPIRES_SECONDS}
      - AUTH_DISABLED=${AUTH_DISABLED}
      - MODELGATE_TRUSTED_IP_HEADERS=${MODELGATE_TRUSTED_IP_HEADERS}
      - MODELGATE_GATEWAY_DEBUG=${MODELGATE_GATEWAY_DEBUG}
      - MODELGATE_JSONL_LOG_ENABLED=${MODELGATE_JSONL_LOG_ENABLED}
      - MODELGATE_JSONL_LOG_PATH=${MODELGATE_JSONL_LOG_PATH}
    volumes:
      - ${APP_PATH}/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      createdBy: "bt_apps"
    networks:
      - baota_net

networks:
  baota_net:
    external: true
