services:
  BT_SERVICE_NAME6:
    image: docker.cnb.cool/btpanel/sync/laya:${VERSION}
    command: ["laya-serve"]
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_IP}:${WEB_HTTP_PORT}:8000"
    environment:
      LAYA_API_KEY: ${LAYA_API_KEY}
    volumes:
      - model-cache:/home/laya/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    labels:
      createdBy: "bt_apps"
    networks:
      - baota_net

volumes:
  model-cache:

networks:
  baota_net:
    external: true
