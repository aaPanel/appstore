name: Update Docker Versions

# This workflow automatically updates Docker image versions for all apps
# It runs weekly or can be triggered manually

on:
  schedule:
    # Run every At 00:00 on day-of-month 1.
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      apps:
        description: 'Specific apps to update (comma-separated, leave empty for all)'
        required: false
        default: ''

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update versions
        env:
          APPS_INPUT: ${{ github.event.inputs.apps }}
        run: |
          if [ -n "$APPS_INPUT" ]; then
            # Update specific apps (safely split by space or comma)
            python3 update_versions.py $APPS_INPUT
          else
            # Update all apps
            python3 update_versions.py
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/*/app.json
          
          # Generate list of updated apps
          UPDATED_APPS=$(git diff --name-only --cached | grep 'app.json' | cut -d'/' -f2 | paste -sd, - || echo "none")
          
          git commit -m "chore: update Docker image versions
          
          Automatically updated app versions from Docker Hub
          
          Updated apps: $UPDATED_APPS"
          git push

      - name: Create summary
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "## Version Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Updated apps:" >> $GITHUB_STEP_SUMMARY
          git diff --name-only HEAD~1 | grep 'app.json' | cut -d'/' -f2 | while read app; do
            echo "- $app" >> $GITHUB_STEP_SUMMARY
          done

      - name: No changes
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "## Version Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No version updates needed - all apps are up to date!" >> $GITHUB_STEP_SUMMARY